<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCP Admin</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        .admin-layout { display: flex; height: 100vh; overflow: hidden; }
        .admin-sidebar { width: 250px; background: var(--bg-surface); border-right: var(--border-width) solid var(--border-color); display: flex; flex-direction: column; }
        .admin-main { flex: 1; overflow-y: auto; padding: 2rem; background: var(--bg-body); }
        .admin-nav-btn { padding: 1rem; text-align: left; background: none; border: none; font-size: 1rem; font-weight: bold; color: var(--text-main); cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .admin-nav-btn:hover { background: var(--bg-body); color: var(--accent-blue); }
        .admin-nav-btn.active { background: var(--accent-blue); color: white; }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--soft-shadow); }
        .admin-table th, .admin-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        .admin-table th { background: var(--bg-surface); font-weight: bold; color: var(--text-muted); }
        .admin-input { padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; width: 100%; margin-bottom: 1rem; }
        .admin-action-btn { padding: 0.4rem 0.8rem; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-right: 0.5rem; }
        .btn-edit { background: var(--accent-blue); color: white; }
        .btn-delete { background: var(--accent-pink); color: white; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="admin-sidebar">
            <div style="padding: 1.5rem; font-family: var(--font-heading); font-size: 1.5rem; color: var(--accent-blue); text-align: center; border-bottom: var(--border-width) solid var(--border-color);">
                WCP ADMIN
            </div>
            <button class="admin-nav-btn active" onclick="switchAdminTab('members')"><i class="fa-solid fa-users"></i> メンバー管理</button>
            <button class="admin-nav-btn" onclick="switchAdminTab('departments')"><i class="fa-solid fa-building"></i> 部署管理</button>
            <button class="admin-nav-btn" onclick="switchAdminTab('books')"><i class="fa-solid fa-book"></i> 図書管理</button>
            <button class="admin-nav-btn" onclick="switchAdminTab('events')"><i class="fa-solid fa-calendar"></i> カレンダー管理</button>
            <button class="admin-nav-btn" onclick="switchAdminTab('categories')"><i class="fa-solid fa-layer-group"></i> カテゴリー管理</button>
            <button class="admin-nav-btn" onclick="switchAdminTab('videos')"><i class="fa-solid fa-video"></i> 動画教材管理</button>
            <div style="margin-top: auto; padding: 1rem;">
                <button class="cyber-btn" style="width: 100%;" onclick="window.close()"><i class="fa-solid fa-arrow-left"></i> 閉じる</button>
            </div>
        </div>
        
        <div class="admin-main">
            <!-- Members Section -->
            <div id="section-members" class="admin-section active">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-users"></i> メンバー管理</h2>
                    <button class="cyber-btn" onclick="alert('未実装: メンバー追加フォーム')"><i class="fa-solid fa-plus"></i> 新規追加</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>背番号</th><th>名前</th><th>代</th><th>管理者権限</th><th>操作</th></tr></thead>
                    <tbody id="admin-tbody-members"></tbody>
                </table>
            </div>

            <!-- Categories Section -->
            <div id="section-categories" class="admin-section">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-layer-group"></i> カテゴリー進捗管理</h2>
                </div>
                <div id="admin-category-container" style="display: flex; flex-direction: column; gap: 2rem;"></div>
            </div>

            <!-- Videos Section -->
            <div id="section-videos" class="admin-section">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-video"></i> 動画教材管理</h2>
                    <button class="cyber-btn" onclick="openAddVideoModal()"><i class="fa-solid fa-plus"></i> 動画を追加</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>タイトル</th><th>対象カテゴリー</th><th>URL</th><th>操作</th></tr></thead>
                    <tbody id="admin-tbody-videos"></tbody>
                </table>
            </div>

            <!-- Departments Section -->
            <div id="section-departments" class="admin-section">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-building"></i> 部署管理</h2>
                    <button class="cyber-btn" onclick="alert('未実装: 部署追加フォーム')"><i class="fa-solid fa-plus"></i> 新規追加</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>部署ID</th><th>部署名</th><th>非表示設定</th><th>操作</th></tr></thead>
                    <tbody id="admin-tbody-departments"></tbody>
                </table>
            </div>

            <!-- Books Section -->
            <div id="section-books" class="admin-section">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-book"></i> 図書管理</h2>
                    <button class="cyber-btn" onclick="openAdminBookModal()"><i class="fa-solid fa-plus"></i> 新規追加</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>画像</th><th>図書ID</th><th>タイトル</th><th>ステータス</th><th>操作</th></tr></thead>
                    <tbody id="admin-tbody-books"></tbody>
                </table>
            </div>

            <!-- Events Section -->
            <div id="section-events" class="admin-section">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-calendar"></i> カレンダー管理</h2>
                    <button class="cyber-btn" onclick="alert('未実装: イベント追加フォーム')"><i class="fa-solid fa-plus"></i> 新規追加</button>
                </div>
                <table class="admin-table">
                    <thead><tr><th>日付</th><th>タイトル</th><th>主催</th><th>操作</th></tr></thead>
                    <tbody id="admin-tbody-events"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="admin-modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeAdminModal()">
        <div class="modal-content" id="admin-modal-content" style="max-height: 90vh; overflow-y: auto;">
            <!-- Modal Content Injected Here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
